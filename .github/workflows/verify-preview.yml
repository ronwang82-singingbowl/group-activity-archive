name: Verify homepage preview build
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout pull request
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install dependencies
        run: npm install
      - name: Build static site
        run: npm run build
      - name: Upload site as review artifact
        uses: actions/upload-artifact@v4
        with:
          name: homepage-preview
          path: dist/
